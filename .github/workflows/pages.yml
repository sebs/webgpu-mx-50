name: Deploy site to GitHub Pages

# The deploy is gated on the test run. The site's central claim is that the suite is green,
# so it must not be able to publish while it isn't (docs/WEBSITE.md §7.3).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from 2026-10-19, and the smoke
    # test drives the image's preinstalled Chrome. Move to a new image deliberately, and watch
    # the first run's "Smoke-test site" log for the Chrome version it reports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      # The gate: typecheck (which now covers site/ and scripts/), unit tests, the Gherkin
      # suite, and the golden scaffolding. If this fails, nothing publishes.
      - name: Test
        run: npm test

      # Before the build: its base_url becomes SITE_URL, which the build needs for the absolute
      # og:image URL social cards require.
      - id: pages
        uses: actions/configure-pages@v6

      # The music video's 720p footage and AAC song, encoded from the committed originals in
      # video/ (the proxies themselves are not committed).
      - name: Encode music video media
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          npm run video:media

      - name: Build site
        run: npm run site:build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # Resolves every module specifier and fetched asset in _site the way a browser would.
      - name: Check site
        run: npm run site:check

      # Loads every route in headless Chrome and fails on any console error or dead request.
      - name: Smoke-test site
        run: npm run site:smoke

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
